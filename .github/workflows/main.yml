name: Build Android sing-box Kernel

on:
  workflow_dispatch:  # 支持手动触发
  push:
    tags: ["v*"]      # 标签触发（例如 v1.10.0）

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出源码（含子模块）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 设置 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'  # 必须 >=1.20

      # 3. 安装基础依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libcap-dev clang

      # 4. 配置 Android NDK 工具链
      - name: Setup Android NDK
        uses: android-actions/setup-ndk@v1
        with:
          ndk-version: r25c  # 推荐稳定版本

      # 5. 交叉编译 Android 版本
      - name: Build for Android (ARM64)
        env:
          TAGS: "with_quic,with_grpc,with_dhcp,with_wireguard,with_ech,with_utls,with_reality_server,with_gvisor,with_clash_api,with_tailscale"  # 启用核心功能
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
        run: |
          make build
          mv ./bin/sing-box ./bin/sing-box-android-arm64

      # 6. 打包并上传产物
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: sing-box-android
          path: ./bin/sing-box-android-arm64

      # (可选) 7. 自动发布到 GitHub Release
      - name: Create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./bin/sing-box-android-arm64
